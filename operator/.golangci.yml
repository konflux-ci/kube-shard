version: "2"

run:
  timeout: 5m
  allow-parallel-runners: true

formatters:
  enable:
    - gofmt
    - goimports

linters:
  default: none
  enable:
    - dupl
    - errcheck
    - copyloopvar
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    goconst:
      min-occurrences: 6
    revive:
      rules:
        - name: comment-spacings
  exclusions:
    rules:
      - path: "api/"
        linters:
          - lll
      - path: "internal/"
        linters:
          - dupl
          - lll
      - path: "internal/certs/"
        linters:
          - goconst
      - path: "_test\\.go"
        linters:
          - goconst
      - path: "test/"
        linters:
          - goconst
      # Ginkgo/Gomega require dot imports
      - text: "dot-imports"
        linters:
          - revive
      # Event handler interface implementations require unused parameters
      - text: "unused-parameter"
        linters:
          - revive
      # Test package directories use underscores
      - text: "don't use an underscore in package name"
        linters:
          - revive
      # Test files redefine builtins (e.g. "new") in local scope
      - path: "_test\\.go"
        text: "redefines-builtin-id"
        linters:
          - revive
