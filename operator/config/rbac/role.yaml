  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kube-shard.konflux-ci.dev
  resources:
  - apishards
  - namespacesyncs
  - webhooksyncs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kube-shard.konflux-ci.dev
  resources:
  - apishards/finalizers
  - namespacesyncs/finalizers
  - webhooksyncs/finalizers
  verbs:
  - update
- apiGroups:
  - kube-shard.konflux-ci.dev
  resources:
  - apishards/status
  - namespacesyncs/status
  - webhooksyncs/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterrolebindings
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
