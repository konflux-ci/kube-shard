name: E2E Tests

on:
  pull_request:

jobs:
  test-e2e:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    env:
      IMG: example.com/operator:v0.0.1
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Create kind cluster
        run: kind create cluster --name kind

      - name: Install cert-manager
        run: make cert-manager

      - name: Build and load operator image
        run: |
          make docker-build IMG=$IMG
          kind load docker-image $IMG --name kind

      - name: Generate manifests and verify code
        run: |
          go mod tidy
          make manifests generate fmt vet

      - name: "E2E: operator install"
        env:
          CERT_MANAGER_INSTALL_SKIP: "true"
        run: go test ./test/e2e/ -v -ginkgo.v -ginkgo.github-output

      - name: "E2E: force aggregation"
        run: go test ./test/e2e/force_aggregation/ -v -ginkgo.v -ginkgo.github-output

      - name: "E2E: CRD sharding"
        run: go test ./test/e2e/crd_sharding/ -v -ginkgo.v -ginkgo.github-output

      - name: "E2E: performance"
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts
        run: |
          mkdir -p "$ARTIFACT_DIR"
          go test ./test/e2e/performance/ -v -ginkgo.v -ginkgo.github-output -timeout 20m

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-performance-logs
          path: artifacts/
          if-no-files-found: ignore
