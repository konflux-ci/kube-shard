apiVersion: apps/v1
kind: Deployment
metadata:
  name: secondary-apiserver
  namespace: tekton-apiserver
spec:
  template:
    spec:
      serviceAccountName: secondary-apiserver-authz
      containers:
      - name: kube-apiserver
        args:
        - --etcd-servers=http://kine.tekton-apiserver.svc:2379
        - --secure-port=6443
        - --tls-cert-file=/etc/kube/pki/serving.crt
        - --tls-private-key-file=/etc/kube/pki/serving.key
        # Request header auth (API aggregation from main KAS)
        - --requestheader-client-ca-file=/etc/kube/pki/front-proxy-ca.crt
        - --requestheader-allowed-names=front-proxy-client
        - --requestheader-username-headers=X-Remote-User
        - --requestheader-group-headers=X-Remote-Group
        - --requestheader-extra-headers-prefix=X-Remote-Extra-
        # Static token auth for direct access (PoC only)
        - --token-auth-file=/etc/kube/pki/token-auth.csv
        # Phase 2: delegate authorization to main cluster via webhook
        - --authorization-mode=Webhook
        - --authorization-webhook-config-file=/etc/kube/authz/webhook-config.yaml
        - --authorization-webhook-version=v1
        # SA signing (required by apiserver binary)
        - --service-account-key-file=/etc/kube/pki/sa-signing.pub
        - --service-account-signing-key-file=/etc/kube/pki/sa-signing.key
        - --service-account-issuer=https://kubernetes.default.svc
        # Phase 3: enable admission webhooks for Tekton validation/mutation
        - --enable-admission-plugins=MutatingAdmissionWebhook,ValidatingAdmissionWebhook
        # Disabled admission plugins (see deploy/poc/secondary-apiserver.yaml for rationale)
        - --disable-admission-plugins=NamespaceLifecycle,ServiceAccount
        volumeMounts:
        - name: pki
          mountPath: /etc/kube/pki
          readOnly: true
        - name: authz
          mountPath: /etc/kube/authz
          readOnly: true
      volumes:
      - name: pki
        secret:
          secretName: secondary-apiserver-certs
      - name: authz
        configMap:
          name: secondary-apiserver-authz-config
