apiVersion: v1
kind: ServiceAccount
metadata:
  name: secondary-apiserver-authz
  namespace: tekton-apiserver
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secondary-apiserver-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: secondary-apiserver-authz
  namespace: tekton-apiserver
