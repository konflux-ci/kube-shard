apiVersion: v1
kind: Secret
metadata:
  name: postgresql-credentials
  namespace: tekton-apiserver
type: Opaque
stringData:
  POSTGRES_USER: kine
  POSTGRES_PASSWORD: kine-poc-secret
  POSTGRES_DB: kine
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: tekton-apiserver
  labels:
    app: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgresql
        image: registry.access.redhat.com/hi/postgresql:18.4
        envFrom:
        - secretRef:
            name: postgresql-credentials
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
          name: postgres
          protocol: TCP
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U kine -d kine
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U kine -d kine
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: tekton-apiserver
spec:
  selector:
    app: postgresql
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
